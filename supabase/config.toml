# license-validate: o Bearer e o LICENSE TOKEN do device (nao um JWT Supabase),
# entao o gateway NAO pode exigir JWT valido — a propria funcao valida a
# assinatura HMAC. verify_jwt=false + apikey anon (enviado pelo agente).
[functions.license-validate]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-alerts]
verify_jwt = false

[functions.offline-daily-report]
verify_jwt = false

[functions.critical-alerts-tick]
verify_jwt = false

[functions.command-verifier]
verify_jwt = false

[functions.agent-release-signed-url]
verify_jwt = false

[functions.agent-logs-cleanup]
verify_jwt = false

[functions.verify-master-password]
verify_jwt = false

# scheduled-shutdown: disparada pelo pg_cron (apikey anon no header). A propria
# funcao usa SERVICE_ROLE p/ ler equipments e enfileirar o reset — sem JWT de usuario.
[functions.scheduled-shutdown]
verify_jwt = false

# agent-auth: o Bearer/apikey e a anon key; a validacao real e por fingerprint +
# token rotativo (FASE 2). Requer env AGENT_TOKEN_SECRET definido em Functions.
[functions.agent-auth]
verify_jwt = false

# agent-asar-key (FASE 3): entrega a chave AES do asar cifrado apos validar
# fingerprint + token. verify_jwt=false; a validacao e feita na propria funcao.
[functions.agent-asar-key]
verify_jwt = false

# agent-offline-watchdog: chamada pelo pg_cron (apikey anon). SEM esta entrada o
# gateway exigia JWT valido e devolvia 401 — o watchdog NUNCA rodava (nenhum
# alerta offline/bridge_dead disparava). Usa SERVICE_ROLE internamente.
[functions.agent-offline-watchdog]
verify_jwt = false

# renov_diag (Diagnóstico Remoto): chamadas pela ferramenta .exe (sem login de
# usuário). O segredo é o PIN de uso único / o code+machine_id da sessao.
[functions.validate-diag-pin]
verify_jwt = false
[functions.diag-session]
verify_jwt = false





